<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriveEasy Rentals - Your Journey Starts Here</title>
  <link rel="stylesheet" href="../Style/home.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container header-container">
      <a href="#" class="logo">Drive<span>Easy</span></a>
      <nav>
        <ul>
          <li><a href="#" class="active">Home</a></li>
          <li><a href="Cars.html">Cars</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="AboutUs.html">About Us</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <div class="mobile-menu">
        <i class="fas fa-bars"></i>
      </div>
    </div>
  </header>

  <!-- Hero + Search -->
  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <h1>Find Your Perfect Rental Car</h1>
        <p>Choose from our wide selection of vehicles for your next adventure</p>
        <a href="Cars.html" class="btn">Browse Cars</a>

        <form class="search-form" id="searchForm">
          <div class="form-group">
            <label for="pickup-location">Pickup Location</label>
            <select id="pickup-location" required>
              <option value="">Select Location</option>
            </select>
          </div>
          <div class="form-group">
            <label for="pickup-date">Pickup Date</label>
            <input type="date" id="pickup-date" required />
          </div>
          <div class="form-group">
            <label for="return-date">Return Date</label>
            <input type="date" id="return-date" required />
          </div>
          <div class="form-group">
            <label for="car-type">Car Type</label>
            <select id="car-type" required>
              <option value="">Select Car Type</option>
            </select>
          </div>
          <button type="submit" class="search-btn">Search Available Cars</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Featured Vehicles (unchanged) -->
  <section class="featured-cars">
    <div class="container">
      <div class="section-title">
        <h2>Featured Vehicles</h2>
        <p>Explore our most popular rental options</p>
      </div>
      <div class="cars-grid" id="featuredCars">
        <!-- home.js will inject these -->
      </div>
    </div>
  </section>

  <!-- Why Choose Us, Testimonials, Footer… (unchanged) -->

  <script type="module" src="../JS/home.js" defer></script>
</body>
</html>
