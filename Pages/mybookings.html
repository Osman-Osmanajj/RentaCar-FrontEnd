<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriveEasy – My Bookings</title>
  <link rel="stylesheet" href="../Style/cars.css" />
  <link rel="stylesheet" href="../Style/mybookings.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container header-container">
      <a href="#" class="logo">Drive<span>Easy</span></a>
      <nav>
         <ul>
           <li><a href="home.html">Home</a></li>
           <li><a href="cars.html">Cars</a></li>
           <li><a href="locations.html">Locations</a></li>
           <li><a href="AboutUs.html">About Us</a></li>
           <li><a href="contactUs.html">Contact</a></li>
           <li><a href="mybookings.html" class="active">My Bookings</a></li>
           <li><a href="settings.html">Settings</a></li>
           <li>
            <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
          </li>
         </ul>
      </nav>
      <div class="mobile-menu">
        <i class="fas fa-bars"></i>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>My Bookings</h1>
        <p>View and manage your car rental reservations.</p>
      </div>
      <div id="bookingsGrid" class="booking-grid"></div>
    </div>
  </main>

  <!-- Modal for Edit Booking -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" id="closeModal">&times;</span>
      <h2>Edit Booking</h2>
      <form id="editBookingForm">
        <label>Pick-up Date
          <input type="date" id="pickupDate" required>
        </label>
        <label>Drop-off Date
          <input type="date" id="dropoffDate" required>
        </label>
        <button type="submit" class="action-btn save-btn">Save Changes</button>
      </form>
    </div>
  </div>

  <div id="payModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" id="closeModalPayment">&times;</span>
      <h2>Payment</h2>
      <form id="paymentform">
        <label>Amount
        <p id="amount"></p>  
        </label>
        <label>Payment Method
          <select id="paymentMethod" required>
            <option value="Card">Credit Card</option>
            <option value="PayPal">PayPal</option>
            <option value="Cash">Cash</option>
          </select>
        </label>
        <button type="submit" class="action-btn save-btn">Submit</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <!-- ...same as before... -->
      </div>
      <div class="copyright">
        <p>&copy; 2023 DriveEasy Rentals. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="../JS/logout.js"></script>
  <script type="module" src="../JS/mybookings.js"></script>
</body>
</html>
