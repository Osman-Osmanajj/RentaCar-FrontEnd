<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports</title>
  <script src="../../JS/admin/sideBar.js"></script>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="headerContainer"></div>
  <div class="main">
    <div id="create-report-container">
      <h2>Create Maintenance Report</h2>
      <form id="create-report-form">
        <input type="number" name="car_id"        placeholder="Car ID"        required>
        <input type="text"   name="service_type" placeholder="Service Type"  required>
        <input type="date"   name="service_date"  required>
        <input type="text"   name="description"  placeholder="Description"   required>
        <input type="number" name="cost"         placeholder="Cost (€)" step="0.01" required>
        <button type="submit">Create Report</button>
      </form>
    </div>

    <div id="card-container">
      <div id="invoice-container"></div>
    </div>
  </div>

  <script>
  const API_BASE   = 'http://localhost:3000/api/maintenance';
  const CREATE_URL = `${API_BASE}/create`;

  async function fetchInvoice() {
    const res = await fetch(`${API_BASE}/all`, {
      method: 'GET',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json',
        'X-Tenant-ID': localStorage.getItem('tenant_id'),
      }
    });
    const data = await res.json();
    const container = document.getElementById('invoice-container');
    container.innerHTML = '';
    data.records.forEach(r => appendInvoiceCard(r));
  }

  function appendInvoiceCard(r) {
    const card = document.createElement('div');
    card.className = 'invoice-card';
    card.innerHTML = `
      <h2>Invoice #${r.id}</h2>
      <p><strong>Car:</strong> ${r.Car.make} ${r.Car.model}</p>
      <p><strong>Service:</strong> ${r.service_type}</p>
      <p><strong>Date:</strong> ${r.service_date}</p>
      <p><strong>Description:</strong> ${r.description}</p>
      <p><strong>Cost:</strong> €${r.cost}</p>
      <button class="delete-btn">Delete</button>
    `;
    card.querySelector('.delete-btn')
        .addEventListener('click', () => deleteInvoice(r.id));
    document.getElementById('invoice-container').append(card);
  }

  async function deleteInvoice(id) {
    if (!confirm('Really delete this report?')) return;
    const res = await fetch(`${API_BASE}/${id}`, {
      method: 'DELETE',
      credentials: 'include',
      headers: { 'X-Tenant-ID': localStorage.getItem('tenant_id') }
    });
    if (res.ok) fetchInvoice();
    else alert('Delete failed');
  }

  document.getElementById('create-report-form')
    .addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      const payload = {
        car_id:       +f.car_id.value,
        service_type: f.service_type.value,
        service_date: f.service_date.value,
        description:  f.description.value,
        cost:         parseFloat(f.cost.value),
      };
      const res = await fetch(CREATE_URL, {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'X-Tenant-ID': localStorage.getItem('tenant_id'),
        },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        f.reset();
        fetchInvoice();
      } else {
        alert('Failed to create report');
      }
    });

  // initial load
  fetchInvoice();
</script>
</body>
</html>
