<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Rental Admin Dashboard</title>
  <script src="../../JS/admin/checkAdmin.js"></script>
  <link rel="stylesheet" href="admin.css">
  <script src="../../JS/admin/sideBar.js"></script>
</head>
<body>
  <!-- Sidebar -->
 <div id="headerContainer"></div>
  <!-- Main Content -->
  <div class="main">
    <header>
      <h1>Dashboard</h1>
      <div class="text-sm">Welcome</div>
    </header>

    <!-- Summary Cards -->
    <div class="cards">
      <div class="card">
        <h2>Total Cars</h2>
        <p>84</p>
      </div>
      <div class="card">
        <h2>Active Bookings</h2>
        <p>27</p>
      </div>
      <div class="card">
        <h2>Total Customers</h2>
        <p>312</p>
      </div>
      <div class="card">
        <h2>Revenue This Month</h2>
        <p>$12,480</p>
      </div>
    </div>

    <!-- Recent Bookings Table -->
    <h2 style="margin-bottom: 12px;">Bookings</h2>
    <table id="bookings-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Car Name</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Status</th>
          <th>Total Price</th>
        </tr>
      </thead>
      <tbody>
        <!-- Bookings will be inserted here -->
      </tbody>
    </table>
  </div>

  <script>
   const tenantId = localStorage.getItem('tenant');
    fetch('http://localhost:3000/api/booking/all', {
  method: 'GET',
  credentials: 'include',
  headers: {
    'X-Tenant-ID': tenantId
  }
})
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    return res.json();
  })
  .then(data => {
    console.log('Bookings:', data);
    const tbody = document.querySelector('#bookings-table tbody');
    tbody.innerHTML = ''; // Clear existing rows
    data.forEach(booking => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${booking.id}</td>
        <td>${booking.User?.name || 'Unknown User'}</td> <!-- ✅ Show name -->
        <td>${booking.Car.make}</td>
        <td>${booking.start_date}</td>
        <td>${booking.end_date}</td>
        <td>${booking.status}</td>
        <td>${booking.total_price}</td>
      `;
      tbody.appendChild(row);
    });
  })
  .catch(err => {
    console.error('Error fetching bookings:', err);
  });

  </script>
</body>
</html>
