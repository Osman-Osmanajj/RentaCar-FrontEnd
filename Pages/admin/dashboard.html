<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Rental Admin Dashboard</title>

  <script src="../../JS/admin/checkAdmin.js"></script>
  <link rel="stylesheet" href="admin.css">
  <script src="../../JS/admin/sideBar.js"></script>
</head>
<body>
  <!-- Sidebar -->
 <div id="headerContainer"></div>
  <!-- Main Content -->
  <div class="main">
    <header>
      <h1>Dashboard</h1>
      <div class="text-sm">Welcome</div>
      <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
    </header>

    <!-- Summary Cards -->
    <div class="cards">
      <div class="card">
        <h2>Total Cars</h2>
        <p>84</p>
      </div>
      <div class="card">
        <h2>Active Bookings</h2>
        <p>27</p>
      </div>
      <div class="card">
        <h2>Total Customers</h2>
        <p>312</p>
      </div>
      <div class="card">
        <h2>Revenue This Month</h2>
        <p>$12,480</p>
      </div>
    </div>

    <!-- Recent Bookings Table -->
    <h2 style="margin-bottom: 12px;">Bookings</h2>
    <table id="bookings-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Car Name</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Status</th>
          <th>Total Price</th>
          <th>Review</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        <!-- Bookings will be inserted here -->
      </tbody>
    </table>
  </div>

  <script>

    
document.getElementById('logoutBtn').addEventListener('click', () => {
  fetch('http://localhost:3000/api/auth/logout', { 
    method: 'POST',
    credentials: 'include', 
    headers: {
      'Content-Type': 'application/json'
    }
  })
  .then(res => res.ok ? res.json() : Promise.reject(res.statusText))
  .then(data => {
    console.log('Logout successful:', data);
    
    localStorage.removeItem('token');
    localStorage.removeItem('userId')
    localStorage.removeItem('tenant')
    window.location.href = '../../Index.html'; 
  })
  .catch(err => {
    console.error('Logout failed:', err);
    localStorage.removeItem('token');
    window.location.href = '../../Index.html';
  });
});



   const tenantId = localStorage.getItem('tenant_id');
    fetch('http://localhost:3000/api/booking/all', {
  method: 'GET',
  credentials: 'include',
  headers: {
    'X-Tenant-ID': tenantId
  }
})
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    return res.json();
  })
  .then(data => {
    console.log('Bookings:', data);
    const tbody = document.querySelector('#bookings-table tbody');
    tbody.innerHTML = ''; 
    data.forEach(booking => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${booking.id}</td>
        <td>${booking.User?.name || 'Unknown User'}</td> 
        <td>${booking.Car.make}</td>
        <td>${booking.start_date}</td>
        <td>${booking.end_date}</td>
        <td>${booking.status}</td>
        <td>${booking.total_price}</td>
        <td><button class="edit-btn" data-id="${booking.id}">Edit</button></td>
        <td><button class="delete-btn" data-id="${booking.id}">Delete</button></td>
      `;
      tbody.appendChild(row);
    });


    

  document.querySelectorAll('.edit-btn').forEach(button => {
  button.addEventListener('click', async (e) => {
    const bookingId = e.target.dataset.id;
    // For example: prompt for new status
    const newStatus = prompt("Enter new status (Pending, Completed, Cancelled):");
    if (!newStatus) return;

    try {
      const res = await fetch(`http://localhost:3000/api/booking/${bookingId}`, {
        method: 'PATCH',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'X-Tenant-ID': tenantId
        },
        body: JSON.stringify({ status: newStatus })
      });
      if (!res.ok) throw new Error('Failed to update booking');

      alert('Booking updated!');
      location.reload();  // reload to fetch updated data
    } catch (err) {
      alert('Error updating booking: ' + err.message);
    }
  });
});

document.querySelectorAll('.delete-btn').forEach(button => {
  button.addEventListener('click', async (e) => {
    const bookingId = e.target.dataset.id;
    if (!confirm('Are you sure you want to delete this booking?')) return;

    try {
      const res = await fetch(`http://localhost:3000/api/booking/${bookingId}`, {
        method: 'DELETE',
        credentials: 'include',
        headers: {
          'X-Tenant-ID': tenantId
        }
      });
      if (!res.ok) throw new Error('Failed to delete booking');

      alert('Booking deleted!');
      location.reload();  // reload to refresh table
    } catch (err) {
      alert('Error deleting booking: ' + err.message);
    }
  });
});
  })
  .catch(err => {
    console.error('Error fetching bookings:', err);
  });



  /////////////////////////////////////////////////////////////////




  </script>
</body>
</html>
