<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/validator@13.9.0/validator.min.js"></script>
</head>
<body>
    <div id="headerContainer"></div>
    <div class="main">
        <header>
            <h1>Settings</h1>
            <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
        </header>

        <section id="settings">
            <h2>Settings</h2>
            <form id="settings-form">
                <label for="OldPassword">Password</label>
                <input type="password" id="OldPassword" name="OldPassword" required>

                <label for="Password">New Password</label>
                <input type="password" id="Password" name="Password" required>

                <label for="ConfinrmPassword">Confirm Password</label>
                <input type="password" id="ConfinrmPassword" name="ConfinrmPassword" required>
                

                <button type="submit" id="submit">Save Settings</button>
            </form>
        </section>
    </div>

    <script src="../../JS/admin/checkAdmin.js"></script>
    <script src="../../JS/admin/sideBar.js"></script>
    <script>
        const userid = localStorage.getItem('userId');


        document.getElementById('logoutBtn').addEventListener('click', () => {
            fetch('http://localhost:3000/api/auth/logout', { 
                method: 'POST',
                credentials: 'include', 
                headers: {
                'Content-Type': 'application/json'
                }
            })
            .then(res => res.ok ? res.json() : Promise.reject(res.statusText))
            .then(data => {
                console.log('Logout successful:', data);
                
                localStorage.removeItem('token');
                localStorage.removeItem('userId')
                localStorage.removeItem('tenant')
                window.location.href = '../../Index.html'; 
            })
            .catch(err => {
                console.error('Logout failed:', err);
                localStorage.removeItem('token');
                window.location.href = '../../Index.html';
            });
            });

       
document.getElementById('submit').addEventListener('click', async (e) => {
    e.preventDefault();

    const oldPassword = document.getElementById('OldPassword').value.trim();
    const newPassword = document.getElementById('Password').value.trim();
    const confirmPassword = document.getElementById('ConfinrmPassword').value.trim();

    if (!oldPassword || !newPassword || !confirmPassword) {
        alert("All fields are required!");
        return;
    }

    if (newPassword !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    if (!validator.isStrongPassword(newPassword, {
        minLength: 8,
        minLowercase: 1,
        minUppercase: 1,
        minNumbers: 1,
        minSymbols: 1
    })) {
        alert("New password must be at least 8 characters long and include uppercase, lowercase, number, and symbol.");
        return;
    }

    try {
        const response = await fetch(`http://localhost:3000/api/user/users/${userid}`, {
            method: 'GET',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const data = await response.json();
        console.log('Fetched user:', data);
    } catch (error) {
        console.error('Error fetching user data:', error);
    }

    try {
        const response = await fetch(`http://localhost:3000/api/user/users/${userid}`, {
            method: 'PATCH',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                oldpassword: oldPassword,
                newPassword: newPassword,
            })
        });
        const result = await response.json();
        console.log('Password update result:', result);

        if (!response.ok) {
            alert(result.message || 'Failed to update password.');
            return;
        }

        alert("Password updated successfully");
    } catch (error) {
        console.error('Error updating password:', error);
        alert('An error occurred while updating the password.');
    }
});


    </script>

</body>
</html>
