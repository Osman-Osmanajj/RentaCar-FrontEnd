<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Book Your Car - DriveEasy</title>
  <link rel="stylesheet" href="../Style/MyBooking.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="car-header" id="carImageContainer"></div>
    <div class="car-title" id="carInfoContainer">
      <h2>Loading car…</h2>
    </div>

    <form id="bookingForm">
      <label for="startDate">Pick-up Date</label>
      <input type="date" id="startDate" required />
      
      <label for="endDate">Return Date</label>
      <input type="date" id="endDate" required />
      
      <button type="submit">Confirm Booking</button>
    </form>
    <div class="message" id="message"></div>
  </div>

  <script src="../JS/MyBooking.js"></script>
  <script src="../JS/logout.js"></script>
  <script src="../JS/admin/checkCustomer.js"></script>
</body>
</html>
