<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Book Your Car</title>
  <link
    rel="stylesheet"
    href="../Style/MyBooking.css"
  />

</head>
<body>
  <div class="container">
    <div class="car-header" id="carImageContainer"></div>
    <div class="car-title" id="carInfoContainer">
      <h2>Loading car…</h2>
    </div>


    <form id="bookingForm">
      <label>
        Pick-up Date
        <input type="date" id="startDate" required />
      </label>
      <label>
        Return Date
        <input type="date" id="endDate" required />
      </label>
      <button type="submit">Confirm Booking</button>
    </form>
    <div class="message" id="message"></div>
  </div>

    <script src="../JS/MyBooking.js"></script>
</body>
</html>
