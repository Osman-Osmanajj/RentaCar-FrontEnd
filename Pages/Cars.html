<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Cars - SpeedyRent Car Rental</title>
    <link rel="stylesheet" href="../Style/cars.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="page-header">
                <h1>Available Cars</h1>
                <p>Browse our selection of quality vehicles ready for rent</p>
            </div>
            <div class="car-grid" id="carList">
            </div>
        </div>
    </main>

    <script>
  const tenantId = 1;
  const userId = 1;
  const API_URL = 'http://localhost:3000/api/car/img-type';

  fetch(API_URL, {
    headers: {
      'Content-Type': 'application/json',
      'X-Tenant-ID': tenantId
    }
  })
    .then(res => res.ok ? res.json() : Promise.reject(res.statusText))
    .then(cars => {
      const carList = document.getElementById('carList');
      carList.innerHTML = '';

      cars.forEach(car => {
        const carCard = document.createElement('div');
        carCard.className = 'car-card';

        const carImages = car.CarImages || [];
        const imgUrl = carImages.length
          ? carImages[0].image_url
          : 'https://via.placeholder.com/300x200?text=No+Image';


        const carTypeName = car.CarType?.name || 'No Type';
      
        const btn = document.createElement('button');
        btn.className = 'book-button';
        btn.type = 'button';
        btn.addEventListener('click', () => {
          window.location.href = `mybooking.html?carId=${car.id}&tenantId=${tenantId}&userId=${userId}`;
          // localStorage.setItem("ID",car.id)
          // localStorage.setItem("tenant",tenantId)
        });

        btn.innerHTML = `
          <div class="car-image"><img src="${imgUrl}" alt="${car.make} ${car.model}"></div>
          <div class="car-info">
            <h2>${car.make} ${car.model}</h2>
            <div class="car-details">
              <span><i class="fas fa-calendar-alt"></i> ${car.year}</span>
              <span><i class="fas fa-id-card"></i> ${car.license_plate}</span>
              <span><i class="fas fa-flag"></i> ${car.status}</span>
              <span><i class="fas fa-car"></i> ${carTypeName}</span>
            </div>
          </div>
        `;

        carCard.appendChild(btn);
        carList.appendChild(carCard);
      });
    })
    .catch(err => {
      console.error(err);
      document.getElementById('carList').innerHTML = '<p class="error">Error loading cars.</p>';
    });
</script>

</body>
</html>
