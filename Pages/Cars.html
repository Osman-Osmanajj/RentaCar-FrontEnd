<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Cars - SpeedyRent Car Rental</title>
    <link rel="stylesheet" href="../Style/cars.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="page-header">
                <h1>Available Cars</h1>
                <p>Browse our selection of quality vehicles ready for rent</p>
            </div>
            <div class="car-grid" id="carList">
            </div>
        </div>
    </main>

    <script>
      const tenantId = 1;  

      fetch(`http://localhost:3000/api/car/img-type`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'X-Tenant-ID': tenantId
        }
      })
        .then(response => response.json())
        .then(data => {
          const carList = document.getElementById('carList');
          carList.innerHTML = '';

          data.forEach(car => {
            const carCard = document.createElement('div');
            carCard.className = 'car-card';

            const carImages = car.CarImages || [];
            const imageHtml = carImages.length > 0
              ? `<div class="car-image"><img src="${carImages[0].image_url}" alt="${car.make} ${car.model}"></div>`
              : `<div class="car-image"><p><em>No image available</em></p></div>`;
            
            const carType = car.CarType;

            const typeHtml = carType && carType.name
              ? carType.name
              : 'No Type';

            carCard.innerHTML = `
              ${imageHtml}
              <div class="car-info">
                <h2>${car.make} ${car.model}</h2>
                <div class="car-details">
                  <span><i class="fas fa-calendar-alt"></i> ${car.year}</span>
                  <span><i class="fas fa-id-card"></i> ${car.license_plate}</span>
                  <span><i class="fas fa-flag"></i> ${car.status}</span>
                  <span><i class="fas fa-car"></i>${typeHtml}</span>
                </div>
              </div>
            `;

            carList.appendChild(carCard);
          });
        })
        .catch(error => {
          console.error('Error fetching car images:', error);
          document.getElementById('carList').innerHTML = '<p>Error loading cars.</p>';
        });
    </script>
</body>
</html>
