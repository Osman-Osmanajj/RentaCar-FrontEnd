<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveEasy - Login</title>
  <link rel="stylesheet" href="Style/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/validator@13.9.0/validator.min.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>DriveEasy</h1>
    </div>
    
    <!-- Login Form -->
    <div id="login-form">
      <div class="auth-form">
        <h2>Welcome Back</h2>
        <form id="login-form-element">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" required>
          </div>
          <div class="auth-links">
            <a href="#" id="show-forgot-password" class="auth-link">Forgot password?</a>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Login</button>
          </div>
        </form>
        
        <div class="auth-divider">
          <span>Don't have an account?</span>
        </div>
        
        <div class="auth-links">
          <a href="#" id="show-register" class="auth-link">Create an account</a>
        </div>
      </div>
    </div>
    
    <!-- Register Form -->
    <div id="register-form">
      <div class="auth-form">
        <h2>Create Account</h2>
        <form id="register-form-element">
          <div class="form-group">
            <label for="register-name">Full Name</label>
            <input type="text" id="register-name" placeholder="Enter your full name" required>
          </div>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" placeholder="Create a password" required>
          </div>
          <div class="form-group">
            <label for="register-confirm-password">Confirm Password</label>
            <input type="password" id="register-confirm-password" placeholder="Confirm your password" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Register</button>
          </div>
        </form>
        
        <div class="auth-divider">
          <span>Already have an account?</span>
        </div>
        
        <div class="auth-links">
          <a href="#" id="show-login" class="auth-link">Login to your account</a>
        </div>
      </div>
    </div>
    
    <!-- Forgot Password Form -->
    <div id="forgot-password-form">
      <div class="auth-form">
        <h2>Reset Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
        <form id="forgot-password-form-element">
          <div class="form-group">
            <label for="forgot-email">Email</label>
            <input type="email" id="forgot-email" placeholder="Enter your email" required>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Send Reset Link</button>
          </div>
        </form>
        
        <div class="auth-divider">
          <span>Remember your password?</span>
        </div>
        
        <div class="auth-links">
          <a href="#" id="show-login-form-forgot" class="auth-link">Back to login</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="JS/index.js"></script>
</body>
</html>
