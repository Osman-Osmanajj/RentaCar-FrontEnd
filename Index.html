<!-- index.html (root) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>DriveEasy – Login</title>
  <link rel="stylesheet" href="Style/style.css">
  <script src="https://cdn.jsdelivr.net/npm/validator@13.7.0/validator.min.js"></script>

</head>
<body>
  <div class="login-container">
    <!-- LOGIN -->
    <div id="login-form">
      <h2>Login</h2>
      <form id="login-form-element">
        <input type="text"     id="login-email"    placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button>Login</button>
      </form>
      <div class="forgot-password">
        <a href="#" id="show-forgot-password">Forgot Password?</a>
      </div>
      <div class="signup-link">
        Don’t have an account? <a href="#" id="show-register">Register</a>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="register-form" style="display:none">
      <h2>Register</h2>
      <form id="register-form-element">
        <input type="text"     id="reg-username"     placeholder="Username">
        <input type="email"    id="reg-email"        placeholder="Email">
        <input type="password" id="reg-password"     placeholder="Password">
        <input type="password" id="reg-password2"    placeholder="Confirm Password">
        <button>Register</button>
      </form>
      <div class="signup-link">
        Already have an account? <a href="#" id="show-login">Login</a>
      </div>
    </div>

    <!-- FORGOT -->
    <div id="forgot-password-form" style="display:none">
      <h2>Forgot password</h2>
      <form action="Pages/OtpVerification.html">
        <input type="email" placeholder="Enter your email">
        <button>Submit</button>
      </form>
      <div class="signup-link">
        Remembered? <a href="#" id="show-login-form-forgot">Login</a>
      </div>
    </div>
  </div>

  <script type="module" src="JS/index.js" defer></script>
</body>
</html>
